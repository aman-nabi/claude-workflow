# tiered-workflow Stop gate config. Copy to <repo>/.claude/workflow-gate.conf and commit it.
# The gate runs these commands only after you trust this file with /tiered-workflow:gate-trust,
# and again after any change to it.
# KEY=VALUE lines. The file is read, never sourced, so only these keys mean anything.
#
# Steps run from the repo root, in the order STEPS names them (default LINT TYPECHECK TEST);
# each step's command is <NAME>_CMD.
# {files} becomes the turn's changed files that match GATE_EXTENSIONS, as quoted absolute
# paths; {files:<folder>} becomes only those inside that folder, for repos with several
# packages. A command whose placeholder has no files is skipped, never run on everything.
# $TIERED_WORKFLOW_SCRIPTS points at the plugin's scripts. tsc-changed.sh fails only on
# type errors in the given files, so errors that already exist elsewhere do not block.
# Errors the change causes in files it did not touch are left to the full typecheck at
# review. Give it a tsconfig that includes the source files; it fails if tsc checked none.

LINT_CMD=npx eslint --quiet {files}
TYPECHECK_CMD="$TIERED_WORKFLOW_SCRIPTS/tsc-changed.sh" -- {files}
TEST_CMD=npx vitest related --run --silent --passWithNoTests {files}

# A repo with two packages:
# STEPS=BE_LINT BE_TYPES BE_TEST FE_LINT FE_TYPES FE_TEST
# BE_LINT_CMD=cd backend && npx eslint --quiet {files:backend/}
# BE_TYPES_CMD=cd backend && "$TIERED_WORKFLOW_SCRIPTS/tsc-changed.sh" -- {files:backend/}

# GATE_EXTENSIONS=ts tsx js jsx mjs cjs   files that "{files}" passes on
# STEP_TIMEOUT=300                        seconds per command; steps times repos must fit the hook's 1800s
# MAX_ATTEMPTS=3                          blocks allowed per user prompt
# GATE_ENABLED=1                          0 turns the gate off for this repo
#
# Anywhere: CLAUDE_WORKFLOW_GATE=off in the environment turns the gate off everywhere,
# and a file named tiered-workflow-pause in the repo's git dir pauses it for one turn.

# Comment check on the comment lines Claude adds (scripts/comment-check.sh). The rule is
# no comments by default. It flags history or session talk, dated change notes, TODOs
# without a ticket, divider comments, blocks longer than COMMENT_MAX_LINES, and a file
# that gains more than COMMENT_MAX_PER_FILE comment lines in one turn. 0 means no limit.
# COMMENT_CHECK=1
# COMMENT_MAX_LINES=2
# COMMENT_MAX_PER_FILE=6
# COMMENT_BANNERS=1     set 0 when the repo's convention uses section dividers
#
# Locked acceptance tests: <git-dir>/tiered-workflow-locked-tests lists them, one repo-relative
# path per line; the PreToolUse hook refuses edits to them. Only the user creates
# <git-dir>/tiered-workflow-tests-unlocked, which lifts the lock until the turn ends.

# In a host folder that holds several repos, list them here instead; patterns such as
# tmp/*/app reach every worktree. Each listed repo needs its own .claude/workflow-gate.conf,
# and a config that sets REPOS is never checked itself.
# REPOS=frontend backend tmp/*/frontend
